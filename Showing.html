<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tournament Showing</title>
	<style>
		:root { --ink: #17212f; --muted: #687486; --accent: #e85d3f; --surface: #fff; }
		* { box-sizing: border-box; }
		body {
			min-height: 100vh;
			margin: 0;
			display: grid;
			place-items: center;
			padding: 24px;
			color: var(--ink);
			background: linear-gradient(135deg, #f3f7fa, #e8eef4);
			font-family: Georgia, "Times New Roman", serif;
		}
		main {
			width: min(100%, 720px);
			padding: clamp(28px, 6vw, 60px);
			background: var(--surface);
			border-left: 6px solid var(--accent);
			box-shadow: 0 18px 50px rgba(23, 33, 47, 0.12);
		}
		.eyebrow { margin: 0 0 12px; color: var(--accent); font: 700 0.75rem Arial, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
		h1 { margin: 0 0 24px; font-size: clamp(2.2rem, 8vw, 4.5rem); line-height: 1.03; overflow-wrap: anywhere; }
		#paragraph { margin: 0; white-space: pre-wrap; color: var(--muted); font: 1.15rem/1.75 Arial, sans-serif; }
		.empty { color: var(--muted); font: 1rem/1.6 Arial, sans-serif; }
	</style>
</head>
<body>
	<main>
		<p class="eyebrow">Tournament announcement</p>
		<h1 id="tournament-title">Tournament</h1>
		<p id="paragraph" class="empty">No tournament information has been added yet.</p>
	</main>

	<script>
		const titleElement = document.getElementById('tournament-title');
		const paragraphElement = document.getElementById('paragraph');

		function showInformation() {
			const tournament = JSON.parse(sessionStorage.getItem('tournamentDetails') || 'null');
			const information = JSON.parse(localStorage.getItem('tournamentInformation') || 'null');
			if (tournament && tournament.tournamentTitle) {
				titleElement.textContent = tournament.tournamentTitle;
			}
			if (information && information.paragraph) {
				paragraphElement.textContent = information.paragraph;
				paragraphElement.className = '';
			}
		}

		showInformation();
		window.addEventListener('storage', showInformation);
	</script>
</body>
</html>
