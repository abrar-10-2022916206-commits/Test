<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Details</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18212f;
            --muted: #657184;
            --line: #d9e0e8;
            --accent: #e85d3f;
            --surface: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: linear-gradient(135deg, #f4f7fb 0%, #e9f0f6 100%);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(100%, 620px);
            padding: 40px;
            background: var(--surface);
            border: 1px solid rgba(24, 33, 47, 0.08);
            border-radius: 8px;
            box-shadow: 0 18px 50px rgba(24, 33, 47, 0.12);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font: 700 0.75rem/1.2 Arial, sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 { margin: 0 0 28px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1; }

        dl { margin: 0; border-top: 1px solid var(--line); }

        .detail {
            display: grid;
            grid-template-columns:  minmax(140px, 0.7fr) 1.3fr;
            gap: 20px;
            padding: 20px 0;
            border-bottom: 1px solid var(--line);
        }

        dt { color: var(--muted); font: 700 0.85rem/1.4 Arial, sans-serif; }
        dd { margin: 0; overflow-wrap: anywhere; font: 1.1rem/1.4 Arial, sans-serif; }

        .empty { margin: 0; color: var(--muted); font: 1rem/1.6 Arial, sans-serif; }

        a {
            display: inline-block;
            margin-top: 28px;
            color: var(--accent);
            font: 700 0.9rem Arial, sans-serif;
            text-decoration: none;
        }

        a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            main { padding: 28px 22px; }
            .detail { grid-template-columns: 1fr; gap: 6px; }
        }
    </style>
</head>
<body>
    <main>
        <p class="eyebrow">Tournament</p>
        <h1>Tournament details</h1>
        <section id="details" aria-live="polite"></section>
    </main>

    <script>
        const detailsContainer = document.getElementById('details');
        const tournament = JSON.parse(sessionStorage.getItem('tournamentDetails') || 'null');

        if (!tournament) {
            detailsContainer.innerHTML = '<p class="empty">No tournament details were submitted yet.</p><a href="registration.html">Go to registration</a>';
        } else {
            const details = [
                ['Tournament ID', tournament.tournamentId],
                ['Tournament Title', tournament.tournamentTitle],
                ['Password', '*'.repeat(tournament.password.length)]
            ];

            const list = document.createElement('dl');
            details.forEach(function ([label, value]) {
                const row = document.createElement('div');
                row.className = 'detail';
                row.innerHTML = '<dt>' + label + '</dt><dd></dd>';
                row.querySelector('dd').textContent = value;
                list.appendChild(row);
            });
            detailsContainer.appendChild(list);
        }
    </script>
</body>
</html>
