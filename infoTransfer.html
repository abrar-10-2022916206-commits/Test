<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Information</title>
    <style>
        :root {
            --ink: #17212f;
            --muted: #687486;
            --line: #dce3ea;
            --accent: #e85d3f;
            --accent-dark: #c8472e;
            --surface: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: linear-gradient(135deg, #f3f7fa, #e8eef4);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(100%, 620px);
            padding: 42px;
            background: var(--surface);
            border: 1px solid rgba(23, 33, 47, 0.08);
            border-radius: 8px;
            box-shadow: 0 18px 50px rgba(23, 33, 47, 0.12);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font: 700 0.75rem/1.2 Arial, sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2.1rem, 7vw, 3.3rem);
            line-height: 1;
        }

        .intro {
            margin: 0 0 28px;
            color: var(--muted);
            font: 1rem/1.6 Arial, sans-serif;
        }

        form {
            display: grid;
            gap: 18px;
        }

        label {
            display: grid;
            gap: 8px;
            font: 700 0.9rem/1.2 Arial, sans-serif;
        }

        textarea {
            width: 100%;
            min-height: 190px;
            padding: 14px;
            resize: vertical;
            color: var(--ink);
            background: #fbfcfe;
            border: 1px solid var(--line);
            border-radius: 4px;
            font: 1rem/1.5 Arial, sans-serif;
        }

        textarea:focus {
            outline: 3px solid rgba(232, 93, 63, 0.2);
            border-color: var(--accent);
        }

        button {
            min-height: 50px;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            font: 700 0.95rem Arial, sans-serif;
        }

        button:hover {
            background: var(--accent-dark);
        }

        .status {
            min-height: 1.4em;
            margin: 0;
            color: var(--muted);
            font: 0.9rem/1.4 Arial, sans-serif;
        }

        @media (max-width: 480px) {
            main {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>
    <main>
        <p class="eyebrow">Tournament information</p>
        <h1 id="tournament-title">Tournament</h1>
        <p class="intro">Write the information you want participants to see.</p>

        <form id="information-form">
            <label for="tournament-paragraph">Tournament information</label>
            <textarea id="tournament-paragraph" name="paragraph" placeholder="Enter tournament information..."
                required></textarea>
            <button type="submit">Show Information</button>
            <p class="status" id="status" role="status"></p>
        </form>
    </main>

    <script>
        const titleElement = document.getElementById('tournament-title');
        const paragraphInput = document.getElementById('tournament-paragraph');
        const informationForm = document.getElementById('information-form');
        const status = document.getElementById('status');
        const activeId = sessionStorage.getItem('currentActiveId');

        if (!activeId) {
            window.location.href = 'Login.html';
        }

        async function loadData() {
            try {
                const response = await fetch('/api/tournament/' + activeId);
                if (response.ok) {
                    const data = await response.json();
                    titleElement.textContent = data.tournamentTitle;
                    paragraphInput.value = data.paragraph || '';
                }
            } catch (err) {
                status.textContent = 'Failed to load tournament info.';
            }
        }

        informationForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            try {
                const response = await fetch('/api/tournament/' + activeId, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ paragraph: paragraphInput.value.trim() })
                });

                if (response.ok) {
                    status.textContent = 'Information saved. Showing.html is updated.';
                } else {
                    status.textContent = 'Failed to save information.';
                }
            } catch (err) {
                status.textContent = 'Server connection error.';
            }
        });

        loadData();
    </script>
</body>

</html>
