<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Registration</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18212f;
            --muted: #657184;
            --line: #d9e0e8;
            --accent: #e85d3f;
            --accent-dark: #c8462c;
            --surface: #ffffff;
            --background: #f4f7fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            color: var(--ink);
            background: linear-gradient(135deg, #f4f7fb 0%, #e9f0f6 100%);
            font-family: Georgia, "Times New Roman", serif;
        }

        main {
            width: min(100%, 520px);
            padding: 40px;
            background: var(--surface);
            border: 1px solid rgba(24, 33, 47, 0.08);
            border-radius: 8px;
            box-shadow: 0 18px 50px rgba(24, 33, 47, 0.12);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font: 700 0.75rem/1.2 Arial, sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(2rem, 6vw, 3rem);
            line-height: 1;
        }

        .intro {
            margin: 0 0 28px;
            color: var(--muted);
            font: 1rem/1.6 Arial, sans-serif;
        }

        form {
            display: grid;
            gap: 20px;
        }

        label {
            display: grid;
            gap: 8px;
            font: 700 0.9rem/1.2 Arial, sans-serif;
        }

        input {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            color: var(--ink);
            background: #fbfcfe;
            border: 1px solid var(--line);
            border-radius: 4px;
            font: 1rem Arial, sans-serif;
        }

        input:focus {
            outline: 3px solid rgba(232, 93, 63, 0.2);
            border-color: var(--accent);
        }

        button {
            min-height: 50px;
            margin-top: 4px;
            color: #fff;
            background: var(--accent);
            border: 0;
            border-radius: 4px;
            cursor: pointer;
            font: 700 0.95rem Arial, sans-serif;
        }

        button:hover {
            background: var(--accent-dark);
        }

        @media (max-width: 480px) {
            main {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>
    <main>
        <h1>Auction registration</h1>
        <p class="intro">Enter the tournament details to continue.</p>

        <form id="registration-form" action="Login.html" method="get">
            <label for="tournament-id">
                Tournament ID
                <input id="tournament-id" name="tournamentId" type="text" autocomplete="off" required>
            </label>

            <label for="tournament-password">
                Password
                <input id="tournament-password" name="password" type="password" autocomplete="current-password"
                    required>
            </label>

            <label for="tournament-title">
                Tournament Title
                <input id="tournament-title" name="tournamentTitle" type="text" autocomplete="organization-title"
                    required>
            </label>

            <button type="submit">Register Tournament</button>
        </form>
    </main>
    <script>
        document.getElementById('registration-form').addEventListener('submit', async function (event) {
            event.preventDefault();

            const formData = new FormData(event.currentTarget);
            const tournamentId = formData.get('tournamentId').trim();
            const password = formData.get('password');
            const tournamentTitle = formData.get('tournamentTitle').trim();

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tournamentId, password, tournamentTitle })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = 'Login.html';
                } else {
                    alert(data.message || 'Registration failed');
                }
            } catch (err) {
                alert('Error connecting to server.');
            }
        });

    </script>
</body>

</html>
